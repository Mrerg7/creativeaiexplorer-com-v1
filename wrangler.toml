# Cloudflare Workers Static Assets — pure static site
# Deploy with: npx wrangler deploy
# No worker script needed; assets are served from the edge.

name = "creativeaiexplorer-com"
compatibility_date = "2026-07-01"

# Static assets configuration for Workers Static Assets (assets-only)
# Do NOT set a binding when there is no Worker script (main).
[assets]
directory = "./dist"
